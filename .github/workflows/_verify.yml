name: maskedrunner

# Reusable gate: fetches the run being checked from the Actions API, verifies it
# against the declared workflow model, and fails when the outcome is not
# reachable. The verifier exits non-zero on reject, so a rejected run turns the
# workflow red without any extra plumbing.
#
# Every step writes what it saw to the run summary. A gate that fails without
# saying why is worse than no gate, and the job log needs a token to read while
# the summary does not.
on:
  workflow_call:
    inputs:
      run_id:
        required: true
        type: string
      spec:
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: check out the pipeline under test
        uses: actions/checkout@v4

      # A plain clone rather than actions/checkout: the default GITHUB_TOKEN is
      # scoped to this repository only, so checking out another repo needs a
      # token it does not have. A public repo clones with no credentials at all.
      - name: fetch MaskedRunner
        env:
          VERIFIER_REPO: ${{ vars.MASKEDRUNNER_REPO || 'RudreshRajvansh/OnSite_Final_RN3' }}
        run: |
          if ! git clone --depth 1 "https://github.com/${VERIFIER_REPO}.git" .maskedrunner 2>clone.log; then
            echo "::error::Could not fetch the verifier from ${VERIFIER_REPO}."
            echo "::error::If that repository is private, either make it public or set"
            echo "::error::a MASKEDRUNNER_TOKEN secret with read access to it."
            cat clone.log
            exit 1
          fi
          echo "verifier commit: $(git -C .maskedrunner rev-parse --short HEAD)"

      - name: cache the verifier build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .maskedrunner/target
          key: maskedrunner-${{ runner.os }}-${{ hashFiles('.maskedrunner/Cargo.lock') }}

      - name: build the verifier
        working-directory: .maskedrunner
        run: cargo build --release -p maskedrunner-cli

      - name: check the declared model is present
        run: |
          set -euo pipefail
          SPEC="${{ inputs.spec }}"
          if [ ! -f "$SPEC" ]; then
            echo "::error::No declared model at '$SPEC' in ${{ github.repository }}."
            echo "::error::Generate one with: maskedrunner generate --workflow <file> --out $SPEC"
            ls -R maskedrunner 2>/dev/null || echo "(no maskedrunner/ directory)"
            exit 1
          fi
          MAP=.maskedrunner/spec/live.map.json
          test -f "$MAP" || { echo "::error::verifier checkout has no $MAP"; exit 1; }
          {
            echo "### MaskedRunner"
            echo
            echo "- model: \`$SPEC\` ($(sha256sum "$SPEC" | cut -c1-12))"
            echo "- map: \`$MAP\` ($(sha256sum "$MAP" | cut -c1-12))"
            echo "- verifier: \`$(git -C .maskedrunner rev-parse --short HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: fetch the run under test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.run_id }}" > run.json

          # The Actions API lags behind `needs:` satisfaction: a job can be over
          # while its conclusion still reads null. Verifying that snapshot drops
          # the job from the observation and looks exactly like a rejection, so
          # wait for every job but this gate to reach a terminal state.
          for attempt in $(seq 1 20); do
            gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.run_id }}/jobs?per_page=100" > jobs.json
            pending=$(jq '[.jobs[] | select(.name | contains("${{ github.job }}") | not) | select(.conclusion == null)] | length' jobs.json)
            [ "$pending" -eq 0 ] && break
            echo "waiting for ${pending} job(s) to report a conclusion (attempt ${attempt})"
            sleep 3
          done

          jq -e '.id'   run.json  > /dev/null || { echo "::error::run.json is not a run"; cat run.json; exit 1; }
          jq -e '.jobs' jobs.json > /dev/null || { echo "::error::jobs.json has no jobs"; cat jobs.json; exit 1; }

          {
            echo
            echo "#### Jobs the API reported"
            echo
            echo '| job | conclusion | started |'
            echo '| --- | --- | --- |'
            jq -r '.jobs[] | "| `\(.name)` | \(.conclusion // "in_progress") | \(.started_at) |"' jobs.json
          } >> "$GITHUB_STEP_SUMMARY"

      # Exit 2 means the importer could not read the run; exit 1 would mean the
      # run is unreachable in the model. Never let the first be shown as the
      # second - a verdict that was not computed must not be reported as one.
      - name: normalize the run into an observation
        run: |
          set -uo pipefail
          .maskedrunner/target/release/maskedrunner ingest-actions \
            --run run.json --jobs jobs.json \
            --map .maskedrunner/spec/live.map.json \
            --out observation.json 2>&1 | tee import.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::MaskedRunner could not read this run, so it reached NO verdict."
            echo "::error::This is a gate failure, not a rejection of the pipeline."
            {
              echo
              echo "#### Could not observe this run"
              echo
              echo "The gate failed to import the run, so **no verdict was reached**."
              echo "This is not a rejection."
              echo
              echo '```'
              cat import.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          {
            echo
            echo "#### Observation"
            echo
            echo '```json'
            cat observation.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: verify the run is reachable in the declared workflow
        run: |
          set -uo pipefail
          .maskedrunner/target/release/maskedrunner verify \
            --spec "${{ inputs.spec }}" \
            --observation observation.json \
            --certificate "run-${{ inputs.run_id }}.cert.json" 2>&1 | tee verdict.txt
          status=${PIPESTATUS[0]}
          {
            echo
            echo "#### Verdict"
            echo
            echo '```'
            cat verdict.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 1 ]; then
            echo "::error::REJECTED: this run reached an outcome the declared workflow cannot produce."
          elif [ "$status" -ne 0 ]; then
            echo "::error::The verifier itself failed, so no verdict was reached."
          fi
          exit "$status"

      - name: publish the certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maskedrunner-evidence-${{ inputs.run_id }}
          path: |
            run-*.cert.json
            observation.json
            jobs.json
            verdict.txt
          if-no-files-found: warn
