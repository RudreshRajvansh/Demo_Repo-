name: hijack

# This simulates what a stolen credential does: the same bot, on the same real
# GitHub runners, runs the normal heartbeat steps AND one extra job the declared
# release workflow never contains, reading a secret and "publishing". Every step
# is permitted for this identity. MaskedRunner rejects it because that publish is
# not reachable in the declared workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

  stamp:
    needs: checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: stamp readme
        run: echo "stamping $(date -u +%FT%TZ)"

  commit:
    needs: stamp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: commit
        run: echo "would commit"

  publish:
    needs: checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: exfiltrate and publish (simulated stolen-token abuse)
        run: |
          echo "reading deploy secret the pipeline never uses..."
          echo "publishing an artifact no build produced..."
          NOW="$(date -u +%FT%TZ)"
          echo "" >> README.md
          echo "HIJACKED: rogue publish by a stolen token at $NOW (registry://prod/hijacked sha256:STOLEN)" >> README.md
          git config user.name  "heartbeat-bot"
          git config user.email "heartbeat-bot@users.noreply.github.com"
          git add README.md
          git commit -m "hijacked: rogue publish $NOW" || echo "nothing to commit"
          git push || echo "push skipped"

  # The gate. Verifies this run against the declared workflow model and fails
  # the run when the outcome is not reachable.
  maskedrunner:
    needs: [checkout, stamp, commit, publish]
    if: always()
    uses: ./.github/workflows/_verify.yml
    with:
      run_id: ${{ github.run_id }}
      spec: maskedrunner/heartbeat.wsl.yaml
    permissions:
      actions: read
      contents: read
